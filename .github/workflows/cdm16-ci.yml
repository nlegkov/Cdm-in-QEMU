name: CdM-16 CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: CdM-16 build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential gcovr ninja-build pkg-config python3-venv \
            libglib2.0-dev libpixman-1-dev libfdt-dev zlib1g-dev

      - name: Configure CdM-16
        run: |
          mkdir build
          cd build
          ../configure --target-list=cdm16-softmmu \
            --disable-docs --disable-werror --disable-rust --enable-gcov

      - name: Build
        run: make -C build -j2

      - name: Run unit tests
        run: make -C build -j2 check-unit

      - name: Run QEMU integration tests
        run: make -C build -j2 check-qtest

      - name: Generate HTML coverage reports
        run: |
          make -C build coverage-html
          mkdir -p build/meson-logs/cdm16-coverage
          gcovr --root . \
            --filter '^target/cdm16/' \
            --filter '^hw/cdm16/' \
            --filter '^hw/char/cdm_uart\.c$' \
            --html-details build/meson-logs/cdm16-coverage/index.html build

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: cdm16-coverage
          path: |
            build/meson-logs/coveragereport/
            build/meson-logs/cdm16-coverage/
          if-no-files-found: error

      - name: Print failure details
        if: failure()
        run: |
          for log in build/config.log build/meson-logs/meson-log.txt build/meson-logs/testlog.txt; do
            if [ -f "$log" ]; then
              echo "::group::$log"
              tail -n 200 "$log"
              echo "::endgroup::"
            fi
          done
